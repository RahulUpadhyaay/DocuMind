# Render Infrastructure-as-Code Blueprint
# Deploy all 4 components (API, Celery Worker, PostgreSQL with pgvector, and Redis) with 1 click
version: "1"

services:
  # 1. FastAPI Web Service
  - type: web
    name: rag-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: RERANKER_PROVIDER
        value: flashrank
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: MASTER_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rag-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: rag-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: rag-redis
          property: connectionString

  # 2. Celery Background Ingestion Worker
  - type: worker
    name: rag-worker
    runtime: docker
    dockerfilePath: Dockerfile
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: DATABASE_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rag-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: rag-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: rag-redis
          property: connectionString

# 3. Managed PostgreSQL Database with pgvector
databases:
  - name: rag-postgres
    plan: starter
    databaseName: rag_db
    user: rag_user
    postgresMajorVersion: 16

# 4. Managed Redis
redis:
  - name: rag-redis
    plan: starter
    maxmemoryPolicy: noeviction
